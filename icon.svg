<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Survey polygon boundary -->
  <polygon
    points="10,18 32,9 56,17 52,50 14,54"
    fill="#E0F2F1"
    stroke="#00695C"
    stroke-width="3"
    stroke-linejoin="round" />

  <!-- Continuous N-S boustrophedon flight path -->
  <path
    d="M 20 55 L 20 16 A 6 6 0 0 1 32 16 L 32 50 A 6 6 0 0 0 44 50 L 44 19"
    fill="none"
    stroke="#E65100"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round" />

  <!-- Start waypoint -->
  <circle cx="20" cy="55" r="3.8" fill="#E65100" stroke="#FFFFFF" stroke-width="1.4" />

  <!-- Aircraft / drone directional arrow at path end -->
  <path
    d="M 44 7 L 52.5 22 L 44 18.2 L 35.5 22 Z"
    fill="#1565C0"
    stroke="#FFFFFF"
    stroke-width="1.6"
    stroke-linejoin="round" />
</svg>
